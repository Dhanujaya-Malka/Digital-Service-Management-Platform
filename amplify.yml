version: 1
applications:
  - appRoot: frontend
    frontend:
      phases:
        preBuild:
          commands:
            - echo "NEXT_PUBLIC_API_URL=https://virtual-internet-access.duckdns.org:3001" > .env.production
            - npm ci || npm install
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: out
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
